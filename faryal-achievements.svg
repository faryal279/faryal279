  </g>

  <!-- Card 3: Certified -->
  <g>
    <rect x="390" y="10" width="170" height="160" rx="16" class="card-bg"/>
    <text x="530" y="45" text-anchor="end" class="rank" font-size="26" fill="#2EA3F7">A</text>
    <text x="410" y="45" font-size="22">🎓</text>
    <text x="410" y="90" class="title">Certified GenAI</text>
    <text x="410" y="112" class="sub">HEC · 2026</text>
