<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img" aria-label="Faryal Idrees achievements">
  <defs>
    <style>
      .card-bg { fill:#0d1117; stroke:#30363d; stroke-width:1.5; }
      .rank { font-family: Fira Code, monospace; font-weight:700; }
      .title { font-family: Segoe UI, Arial, sans-serif; font-weight:700; fill:#f0f6fc; font-size:15px; }
      .sub { font-family: Fira Code, monospace; fill:#8b949e; font-size:11px; }
    </style>
  </defs>

  <!-- Card 1: Hackathon -->
  <g>
    <rect x="10" y="10" width="170" height="160" rx="16" class="card-bg"/>
    <text x="150" y="45" text-anchor="end" class="rank" font-size="26" fill="#ff2d95">SSS</text>
    <text x="30" y="45" font-size="22">🏆</text>
    <text x="30" y="90" class="title">Hackathon</text>
    <text x="30" y="112" class="sub">HEC National 2025</text>
    <rect x="30" y="150" width="120" height="5" rx="2.5" fill="#30363d"/>
    <rect x="30" y="150" width="120" height="5" rx="2.5" fill="#ff2d95"/>
  </g>

  <!-- Card 2: Top Performer -->
  <g>
    <rect x="200" y="10" width="170" height="160" rx="16" class="card-bg"/>
    <text x="340" y="45" text-anchor="end" class="rank" font-size="26" fill="#ffd60a">S</text>
    <text x="220" y="45" font-size="22">🥇</text>
    <text x="220" y="90" class="title">Top Performer</text>
    <text x="220" y="112" class="sub">Pak Angels · Cohort 3</text>
    <rect x="220" y="150" width="120" height="5" rx="2.5" fill="#30363d"/>
