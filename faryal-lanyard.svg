<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 660" width="420" height="660" role="img" aria-label="Faryal Idrees ID card lanyard">
  <defs>
    <linearGradient id="strapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#2EA3F7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2EA3F7"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- swinging group: straps + clip + card, pivoting from the top anchor -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-2.5 210 18; 2.5 210 18; -2.5 210 18"
      dur="4.5s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- anchor -->
    <circle cx="210" cy="18" r="6" fill="#8b949e"/>

    <!-- straps -->
    <path d="M 210 18 C 150 60, 130 110, 150 150" stroke="url(#strapGrad)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M 210 18 C 270 60, 290 110, 270 150" stroke="url(#strapGrad)" stroke-width="16" fill="none" stroke-linecap="round"/>

    <!-- clip -->
    <rect x="184" y="140" width="52" height="26" rx="8" fill="#8b949e"/>
    <rect x="194" y="150" width="32" height="30" rx="6" fill="#c9d1d9"/>

    <!-- card -->
    <g filter="url(#cardShadow)">
      <rect x="55" y="170" width="310" height="440" rx="26" fill="url(#cardGrad)" stroke="#30363d" stroke-width="2"/>

      <!-- header strip -->
      <rect x="55" y="170" width="310" height="70" rx="26" fill="url(#headerGrad)"/>
      <rect x="55" y="214" width="310" height="26" fill="url(#headerGrad)"/>
      <circle cx="80" cy="196" r="5" fill="#ffffff" opacity="0.85"/>
      <circle cx="98" cy="196" r="5" fill="#ffffff" opacity="0.6"/>
      <circle cx="116" cy="196" r="5" fill="#ffffff" opacity="0.4"/>
      <text x="340" y="201" text-anchor="end" font-family="Fira Code, monospace" font-size="12" fill="#ffffff" opacity="0.9">ID · GENAI-2026</text>

      <!-- avatar monogram -->
      <circle cx="210" cy="300" r="52" fill="#0d1117" stroke="#2EA3F7" stroke-width="3"/>
      <text x="210" y="316" text-anchor="middle" font-family="Fira Code, monospace" font-size="40" font-weight="700" fill="#2EA3F7">FI</text>

      <!-- name & title -->
      <text x="210" y="382" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Faryal Idrees</text>
      <text x="210" y="406" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">Generative AI Engineer</text>

      <!-- divider -->
      <line x1="85" y1="428" x2="335" y2="428" stroke="#30363d" stroke-width="1.5"/>

      <!-- skill pills -->
      <g font-family="Fira Code, monospace" font-size="11" fill="#c9d1d9">
        <rect x="85" y="444" width="82" height="26" rx="13" fill="#1f2733" stroke="#30363d"/>
        <text x="126" y="461" text-anchor="middle">LLMs</text>

        <rect x="175" y="444" width="100" height="26" rx="13" fill="#1f2733" stroke="#30363d"/>
        <text x="225" y="461" text-anchor="middle">Multi-Agent</text>

        <rect x="283" y="444" width="66" height="26" rx="13" fill="#1f2733" stroke="#30363d"/>
        <text x="316" y="461" text-anchor="middle">NLP</text>

        <rect x="85" y="478" width="66" height="26" rx="13" fill="#1f2733" stroke="#30363d"/>
        <text x="118" y="495" text-anchor="middle">RAG</text>

        <rect x="159" y="478" width="100" height="26" rx="13" fill="#1f2733" stroke="#30363d"/>
        <text x="209" y="495" text-anchor="middle">Prompt Eng.</text>

        <rect x="267" y="478" width="82" height="26" rx="13" fill="#1f2733" stroke="#30363d"/>
        <text x="308" y="495" text-anchor="middle">PyTorch</text>
      </g>

      <!-- divider -->
      <line x1="85" y1="518" x2="335" y2="518" stroke="#30363d" stroke-width="1.5"/>

      <!-- contact -->
      <text x="85" y="542" font-family="Fira Code, monospace" font-size="12" fill="#8b949e">GitHub</text>
      <text x="335" y="542" text-anchor="end" font-family="Fira Code, monospace" font-size="12" fill="#f0f6fc">@faryal279</text>

      <text x="85" y="564" font-family="Fira Code, monospace" font-size="12" fill="#8b949e">Email</text>
      <text x="335" y="564" text-anchor="end" font-family="Fira Code, monospace" font-size="11" fill="#f0f6fc">faryalidrees64@gmail.com</text>

      <text x="85" y="586" font-family="Fira Code, monospace" font-size="12" fill="#8b949e">Location</text>
      <text x="335" y="586" text-anchor="end" font-family="Fira Code, monospace" font-size="12" fill="#f0f6fc">Islamabad, PK</text>

